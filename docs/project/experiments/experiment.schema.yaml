$defs:
  Binary:
    additionalProperties: false
    description: A measured artifact, identified by content rather than by where it sat.
    properties:
      args:
        description: Flags this variant carried, e.g. a thread count.
        items:
          type: string
        title: Args
        type: array
      name:
        title: Name
        type: string
      sha256:
        default: ''
        description: Of the binary itself, not its source.
        title: Sha256
        type: string
      size_bytes:
        default: 0
        minimum: 0
        title: Size Bytes
        type: integer
    required:
    - name
    title: Binary
    type: object
  Complexity:
    additionalProperties: false
    description: What the change costs to carry, which the accept rule cannot compute.
    properties:
      lines_changed:
        description: Net lines of production code touched.
        minimum: 0
        title: Lines Changed
        type: integer
      new_dependencies:
        description: Crates or packages added. Empty is the goal.
        items:
          type: string
        title: New Dependencies
        type: array
      new_failure_modes:
        description: Ways this can now go wrong that it could not before.
        items:
          type: string
        title: New Failure Modes
        type: array
      new_unsafe_blocks:
        default: 0
        minimum: 0
        title: New Unsafe Blocks
        type: integer
      notes:
        default: ''
        description: Anything else that argues for or against.
        title: Notes
        type: string
    required:
    - lines_changed
    title: Complexity
    type: object
  JobResult:
    additionalProperties: false
    description: What one measured job did, across every metric.
    properties:
      invalid_samples:
        default: 0
        description: Trials the independent oracle rejected. Nonzero invalidates the job.
        minimum: 0
        title: Invalid Samples
        type: integer
      job:
        description: Job id, for example cold-scan-index.
        title: Job
        type: string
      metrics:
        additionalProperties:
          $ref: '#/$defs/MetricChange'
        description: Keyed by metric name, e.g. wall_ns.
        title: Metrics
        type: object
      qualification:
        anyOf:
        - $ref: '#/$defs/Qualification'
        - type: 'null'
        default: null
      start_state:
        description: Whether a compatible fdu snapshot existed before the timed work.
        enum:
        - cold
        - warm
        title: Start State
        type: string
    required:
    - job
    - start_state
    title: JobResult
    type: object
  Method:
    additionalProperties: false
    properties:
      build_profile:
        default: release
        description: Cargo profile. Timing evidence only ever comes from release.
        title: Build Profile
        type: string
      campaign_stage:
        default: exploratory
        enum:
        - exploratory
        - discovery
        - held-out
        title: Campaign Stage
        type: string
      candidate:
        description: What changed.
        title: Candidate
        type: string
      candidate_binary:
        anyOf:
        - $ref: '#/$defs/Binary'
        - type: 'null'
        default: null
      confidence_interval:
        default: ''
        title: Confidence Interval
        type: string
      control:
        description: What the candidate was compared against.
        title: Control
        type: string
      control_binary:
        anyOf:
        - $ref: '#/$defs/Binary'
        - type: 'null'
        default: null
      interleaved:
        default: true
        description: Variants alternated per ordinal rather than run in blocks.
        title: Interleaved
        type: boolean
      run_artifact:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Path to the raw run JSON this was derived from.
        title: Run Artifact
      stopping_rule:
        default: ''
        title: Stopping Rule
        type: string
      toolchain:
        default: ''
        description: Compiler version the binaries were built with.
        title: Toolchain
        type: string
      trials:
        minimum: 1
        title: Trials
        type: integer
      warmups:
        minimum: 0
        title: Warmups
        type: integer
    required:
    - candidate
    - control
    - trials
    - warmups
    title: Method
    type: object
  MetricChange:
    additionalProperties: false
    description: One metric's paired comparison between the control and the candidate.
    properties:
      candidate_median:
        description: Candidate median, same unit.
        title: Candidate Median
        type: number
      change_pct:
        description: Paired median change, negative meaning the candidate is faster.
        title: Change Pct
        type: number
      ci95_high_pct:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: Upper bound of the 95% bootstrap interval.
        title: Ci95 High Pct
      ci95_low_pct:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: Lower bound of the 95% bootstrap interval on change_pct.
        title: Ci95 Low Pct
      ci_excludes_zero:
        default: false
        description: Whether the interval is clear of zero in either direction, i.e. the measurement says something rather than nothing.
        title: Ci Excludes Zero
        type: boolean
      control_median:
        description: Control median, in the metric's own unit.
        title: Control Median
        type: number
      direction:
        default: unknown
        description: Which way the evidence points, separate from whether we accept it.
        enum:
        - improved
        - regressed
        - unclear
        - unknown
        title: Direction
        type: string
      noninferiority:
        default: unknown
        description: Separate +3% noninferiority classification; never an alias of superiority.
        enum:
        - superior
        - noninferior
        - inferior
        - inconclusive
        - unknown
        title: Noninferiority
        type: string
      pairs:
        default: 0
        description: Trial pairs behind the comparison.
        minimum: 0
        title: Pairs
        type: integer
      passes_acceptance:
        default: false
        description: "Whether the whole interval lies below zero: the project's one-sided accept rule. False does NOT mean unchanged - a regression fails it too."
        title: Passes Acceptance
        type: boolean
      significant:
        default: false
        description: Deprecated alias of passes_acceptance, kept so artifacts recorded before the fields were split still validate. Read passes_acceptance instead.
        title: Significant
        type: boolean
    required:
    - candidate_median
    - change_pct
    - control_median
    title: MetricChange
    type: object
  Qualification:
    additionalProperties: false
    description: Fail-closed adaptive qualification derived from paired raw samples.
    properties:
      campaign_stage:
        enum:
        - exploratory
        - discovery
        - held-out
        title: Campaign Stage
        type: string
      classification:
        enum:
        - superior
        - noninferior
        - inferior
        - inconclusive
        title: Classification
        type: string
      confirmable:
        title: Confirmable
        type: boolean
      major_fault_delta_limit:
        default: 0.0
        title: Major Fault Delta Limit
        type: number
      noninferiority_margin_pct:
        default: 3.0
        title: Noninferiority Margin Pct
        type: number
      policy_rule:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Policy Rule
      policy_stable:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        title: Policy Stable
      reasons:
        items:
          type: string
        title: Reasons
        type: array
      resource_limits_pct:
        additionalProperties:
          type: number
        title: Resource Limits Pct
        type: object
      resources:
        additionalProperties:
          enum:
          - within-limit
          - rejected
          - inconclusive
          type: string
        title: Resources
        type: object
    required:
    - campaign_stage
    - classification
    - confirmable
    title: Qualification
    type: object
  ReferenceTool:
    additionalProperties: false
    description: A third-party tool measured on the same tree, for calibration only.
    properties:
      argv:
        items:
          type: string
        title: Argv
        type: array
      name:
        title: Name
        type: string
      wall_ns_median:
        title: Wall Ns Median
        type: number
    required:
    - name
    - wall_ns_median
    title: ReferenceTool
    type: object
  Subject:
    additionalProperties: false
    description: |-
      What was measured, and on what.

      This is the reproducibility record. Someone re-running the experiment in a year
      needs to know whether they are looking at the same tree on comparable hardware,
      and a timing without that context is a number without a claim attached.

      Reproduction takes two things, and this record long carried only the first.

      **Identity.** The tree is pinned by content, not by name: ``tree_engine_digest``
      is the `fdu-index-record-v1` digest over every entry's path, kind, size, mtime,
      ctime, inode, and device. Two trees with that digest are the same tree in the
      same state. The path is never recorded — ``tree_root_id`` is its SHA-256, enough
      to tell two trees apart without disclosing where either lives.

      **Provenance.** Identity answers "is this the same tree?" and cannot answer
      "how do I get one?". ``tree_provenance`` answers the second, and
      ``tree_reconstructible`` says whether it is an answer at all: a generator
      command is, a live workspace never can be. Without this, a result is verifiable
      only by whoever still has the tree, and its subject-dependence is invisible —
      which is how exp-064's -13.40% was read as a general claim when it was evidence
      about one deep, sparse, generated tree.

      The two are checked differently, and conflating them sets an impossible bar.
      Re-running ``gen_tree.py`` reproduced exp-064's subject exactly on every shape
      field -- 17,041 entries, 1,045 directories, 15,977 files, 19 symlinks, depth 16,
      both byte totals -- and produced a different ``tree_engine_digest``, because that
      digest binds inode, device, mtime and ctime. Shape is what a timing rests on and
      what provenance can promise; the digest pins one instance and is how you check a
      tree you still have.

      The shape fields already carry more than they are usually read for.
      ``tree_apparent_bytes`` far exceeding ``tree_allocated_bytes`` means sparse
      files, so per-file read cost is near zero and any per-file bookkeeping saving
      looks larger than it will on dense content; ``tree_max_depth`` sets how many
      ancestors a per-file walk touches. Both decide what a content-tier number
      transfers to.
    properties:
      filesystem:
        default: ''
        title: Filesystem
        type: string
      host_arch:
        default: ''
        title: Host Arch
        type: string
      host_cores:
        default: 0
        minimum: 0
        title: Host Cores
        type: integer
      host_cpu:
        default: ''
        title: Host Cpu
        type: string
      host_efficiency_cores:
        default: 0
        minimum: 0
        title: Host Efficiency Cores
        type: integer
      host_memory_bytes:
        default: 0
        minimum: 0
        title: Host Memory Bytes
        type: integer
      host_performance_cores:
        default: 0
        description: Big cores, where they are distinguishable.
        minimum: 0
        title: Host Performance Cores
        type: integer
      host_system:
        default: ''
        title: Host System
        type: string
      host_virtualization:
        default: ''
        description: "bare-metal or virtualized. Decides what a cold sample can mean: a hypervisor's page cache sits under the guest's, so dropping the guest's does not reach the disk. Empty means the run did not record it."
        title: Host Virtualization
        type: string
      os_cache:
        default: warm-steady
        description: Page-cache condition. Dropping it needs root, so say which it was.
        title: Os Cache
        type: string
      tree_allocated_bytes:
        default: 0
        minimum: 0
        title: Tree Allocated Bytes
        type: integer
      tree_apparent_bytes:
        minimum: 0
        title: Tree Apparent Bytes
        type: integer
      tree_directories:
        minimum: 0
        title: Tree Directories
        type: integer
      tree_engine_digest:
        default: ''
        description: fdu-index-record-v1 digest of the whole tree; pins exact content.
        title: Tree Engine Digest
        type: string
      tree_entries:
        minimum: 0
        title: Tree Entries
        type: integer
      tree_files:
        default: 0
        minimum: 0
        title: Tree Files
        type: integer
      tree_label:
        title: Tree Label
        type: string
      tree_max_depth:
        minimum: 0
        title: Tree Max Depth
        type: integer
      tree_mutated_during_run:
        default: false
        description: True invalidates the whole experiment; the tree moved mid-run.
        title: Tree Mutated During Run
        type: boolean
      tree_provenance:
        default: ''
        description: 'How this tree was obtained, precisely enough to obtain it again: the generator command with its arguments, the clone source and revision, or the reason no recipe exists. Empty means the run did not record it, which is itself a finding about that artifact.'
        title: Tree Provenance
        type: string
      tree_reconstructible:
        default: false
        description: 'Whether following tree_provenance yields a tree of the same shape: the same counts, sizes, depth and layout, which is what a timing comparison rests on. Not the same tree_engine_digest -- that binds inode, device, mtime and ctime, so a regenerated tree never matches one and a copied one rarely does. False for a live workspace or an unpinned clone: the result stays evidence, but only its author can ever re-run it.'
        title: Tree Reconstructible
        type: boolean
      tree_root_id:
        description: SHA-256 of the tree's path. Never the path.
        title: Tree Root Id
        type: string
      tree_symlinks:
        default: 0
        minimum: 0
        title: Tree Symlinks
        type: integer
    required:
    - tree_apparent_bytes
    - tree_directories
    - tree_entries
    - tree_label
    - tree_max_depth
    - tree_root_id
    title: Subject
    type: object
  Verdict:
    additionalProperties: false
    description: The decision, the number it rests on, and the reason in one sentence.
    properties:
      change_pct:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: The headline paired median change.
        title: Change Pct
      commit:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Commit that landed it, or reverted it.
        title: Commit
      decision:
        enum:
        - accepted
        - rejected
        - superseded
        - blocked
        - in-progress
        - baseline
        title: Decision
        type: string
      primary_job:
        description: The job the decision was taken on.
        title: Primary Job
        type: string
      primary_metric:
        default: wall_ns
        title: Primary Metric
        type: string
      reason:
        description: One sentence. Why this decision and not the other.
        title: Reason
        type: string
      threshold_pct:
        default: -3.0
        description: The bar a change had to clear to be worth carrying.
        title: Threshold Pct
        type: number
    required:
    - decision
    - primary_job
    - reason
    title: Verdict
    type: object
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
description: One turn of the performance loop, from hypothesis to verdict.
properties:
  complexity:
    $ref: '#/$defs/Complexity'
  date:
    pattern: ^\d{4}-\d{2}-\d{2}$
    title: Date
    type: string
  hypotheses:
    description: Hypothesis ids from the performance-loop guide, e.g. H1.
    items:
      type: string
    title: Hypotheses
    type: array
  id:
    description: Stable identifier, e.g. exp-002.
    pattern: ^exp-\d{3}$
    title: Id
    type: string
  method:
    $ref: '#/$defs/Method'
  reference_tools:
    items:
      $ref: '#/$defs/ReferenceTool'
    title: Reference Tools
    type: array
  results:
    items:
      $ref: '#/$defs/JobResult'
    title: Results
    type: array
  subject:
    $ref: '#/$defs/Subject'
  title:
    title: Title
    type: string
  verdict:
    $ref: '#/$defs/Verdict'
required:
- complexity
- date
- id
- method
- subject
- title
- verdict
title: Experiment
type: object
x-softschema:
  contract: fdu.performance:Experiment/v1
  schema_sha256: b5d89d270c318f39e6359624019b25b6a71414e4a5662c776e8dccff8858ec1e
