# Dependency policy. Run with `make audit` (cargo-deny).

[advisories]
version = 2
# No ignores. Any entry added here needs a comment naming the upstream issue and the
# condition under which it can be removed.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # pyo3's build-time dep target-lexicon ships under Apache-2.0 with the LLVM
    # exception, which SPDX treats as a distinct expression from plain Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
# The list above is the set of permissive licenses this project accepts, not an
# inventory of what the tree happens to contain today. Warning about entries that are
# currently unused would just train us to ignore the audit's output.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# The dependency tree is deliberately small: thiserror everywhere, clap and anyhow behind
# the `cli` feature, notify behind `watch`, pyo3 only in the bindings crate. A new
# always-on dependency in the core crate should be a conscious decision, not a drive-by.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
