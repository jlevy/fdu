<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fdu terminal stage</title>
<!--
  One page, two jobs. Opened in a browser it plays a recording; driven by render.mjs it is
  the video's frame source, seeked frame by frame on the recording's own clock, so the
  video and the web embed are the same pixels.

  ?cast=<url>   recording (asciicast v2/v3)
  ?engine=      xterm (default) | asciinema
  ?mode=        play (default) | capture   -- capture hides controls and exposes window.stage
  ?w=&h=        stage size in CSS pixels (capture), default 1920x1080
  ?font=        terminal font size in CSS pixels, default 22
-->
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/700.css">
<link rel="stylesheet" href="../node_modules/asciinema-player/dist/bundle/asciinema-player.css">
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<style>
  :root {
    --bg-1: #0d1117; --bg-2: #161b2e;
    --win: #0f1420; --bar: #1a2030; --edge: rgba(255,255,255,0.08);
    --fg: #d7dce6; --dim: #7d8799;
  }
  html, body { margin: 0; height: 100%; background: var(--bg-1); }
  body { display: grid; place-items: center; font-family: "JetBrains Mono", ui-monospace, monospace; }
  #stage {
    box-sizing: border-box; display: grid; place-items: center;
    background: radial-gradient(120% 120% at 20% 0%, var(--bg-2) 0%, var(--bg-1) 60%);
  }
  .window {
    background: var(--win); border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px var(--edge);
  }
  .bar { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 16px;
         background: var(--bar); border-bottom: 1px solid var(--edge); position: relative; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .title { position: absolute; left: 0; right: 0; text-align: center; color: var(--dim);
           font-size: 15px; pointer-events: none; }
  .term { padding: 18px 22px 22px; }
  /* asciinema-player: flatten its own frame into ours */
  .ap-wrapper, .ap-player { background: var(--win) !important; }
  .ap-terminal { border: 0 !important; }
  body.capture .ap-control-bar, body.capture .ap-overlay-start, body.capture .ap-overlay { display: none !important; }
  .xterm-viewport { overflow: hidden !important; background: var(--win) !important; }
</style>
</head>
<body>
<div id="stage">
  <div class="window">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="title" id="title"></span>
    </div>
    <div class="term"><div id="term"></div></div>
  </div>
</div>
<script src="../node_modules/asciinema-player/dist/bundle/asciinema-player.min.js"></script>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script type="module">
const q = new URLSearchParams(location.search);
const castUrl = q.get("cast");
const engine = q.get("engine") || "xterm";
const capture = q.get("mode") === "capture";
const W = +(q.get("w") || 1920), H = +(q.get("h") || 1080);
const fontSize = +(q.get("font") || 22);
if (capture) document.body.classList.add("capture");
const stage = document.getElementById("stage");
if (capture) { stage.style.width = W + "px"; stage.style.height = H + "px"; }
else { stage.style.width = "100vw"; stage.style.height = "100vh"; }

// One palette for both engines, so the comparison is about rendering, not colors.
const palette = {
  foreground: "#d7dce6", background: "#0f1420",
  colors: ["#1b2130", "#ff6b6b", "#7ee787", "#f2cc60", "#79c0ff", "#d2a8ff", "#56d4dd", "#c9d1d9",
           "#6e7681", "#ffa198", "#a5f3a0", "#f8e3a1", "#a5d6ff", "#e2c5ff", "#9ff0f5", "#ffffff"],
};

// asciicast v2 or v3 -> absolute-time output events, markers, size.
async function loadCast(url) {
  const lines = (await (await fetch(url)).text()).trim().split("\n");
  const header = JSON.parse(lines[0]);
  const v3 = header.version === 3;
  const cols = v3 ? header.term.cols : header.width, rows = v3 ? header.term.rows : header.height;
  let t = 0; const events = [], markers = [];
  for (const line of lines.slice(1)) {
    const [time, code, data] = JSON.parse(line);
    t = v3 ? t + time : time;
    if (code === "o") events.push([t, data]);
    if (code === "m") markers.push([t, data]);
  }
  return { header, cols, rows, events, markers, duration: t };
}

const cast = await loadCast(castUrl);
document.getElementById("title").textContent = cast.header.title || "";
await document.fonts.load(`${fontSize}px "JetBrains Mono"`);
await document.fonts.load(`bold ${fontSize}px "JetBrains Mono"`);
const host = document.getElementById("term");

let seekTo;
if (engine === "xterm") {
  const term = new Terminal({
    cols: cast.cols, rows: cast.rows, fontFamily: '"JetBrains Mono", monospace', fontSize,
    lineHeight: 1.0, theme: { ...palette, cursor: "#d7dce6",
      black: palette.colors[0], red: palette.colors[1], green: palette.colors[2], yellow: palette.colors[3],
      blue: palette.colors[4], magenta: palette.colors[5], cyan: palette.colors[6], white: palette.colors[7],
      brightBlack: palette.colors[8], brightRed: palette.colors[9], brightGreen: palette.colors[10],
      brightYellow: palette.colors[11], brightBlue: palette.colors[12], brightMagenta: palette.colors[13],
      brightCyan: palette.colors[14], brightWhite: palette.colors[15] },
    cursorBlink: false, cursorInactiveStyle: "block", allowProposedApi: true, scrollback: 0,
  });
  term.open(host);
  // An unfocused xterm draws no cursor in the DOM renderer, so a typed space would be invisible.
  term.focus();
  let next = 0, now = 0;
  const write = (d) => new Promise((r) => term.write(d, r));
  seekTo = async (t) => {
    if (t < now) { term.reset(); next = 0; }
    let chunk = "";
    while (next < cast.events.length && cast.events[next][0] <= t) chunk += cast.events[next++][1];
    if (chunk) await write(chunk);
    now = t;
  };
  if (!capture) {
    const t0 = performance.now();
    const tick = async () => { await seekTo((performance.now() - t0) / 1000); requestAnimationFrame(tick); };
    tick();
  }
} else {
  // A named theme is the CSS class `asciinema-player-theme-<name>`. The player resolves it
  // to inline colors when it mounts, so the class must exist before create().
  const css = [`.asciinema-player-theme-fdu { --term-color-foreground: ${palette.foreground};`,
    `--term-color-background: ${palette.background};`,
    ...palette.colors.map((c, i) => `--term-color-${i}: ${c};`), "}"].join("\n");
  const style = document.createElement("style"); style.textContent = css; document.head.append(style);
  const player = AsciinemaPlayer.create(castUrl, host, {
    cols: cast.cols, rows: cast.rows, autoPlay: !capture, preload: true, fit: false,
    terminalFontFamily: '"JetBrains Mono", monospace', terminalFontSize: fontSize + "px",
    terminalLineHeight: 1.25, theme: "fdu", controls: !capture, markers: cast.markers,
  });
  window.player = player;
  await new Promise((r) => player.addEventListener("ready", r));
  seekTo = async (t) => { await player.seek(t); };
}

// The capture contract render.mjs relies on.
window.stage = {
  duration: cast.duration,
  eventTimes: cast.events.map((e) => e[0]),
  markers: cast.markers,
  seek: async (t) => {
    await seekTo(t);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  },
};
window.stageReady = true;
</script>
</body>
</html>
