# Resolve only packages that have cleared the repository's supply-chain cool-off.
# Same policy as crates/fdu-py; see SUPPLY-CHAIN-SECURITY.md for why it exists.
exclude-newer = "14 days"

# First-party tooling is exempt, as documented in SUPPLY-CHAIN-SECURITY.md: the cool-off
# exists to let a compromised upstream release be noticed by somebody else before we
# take it, and that argument does not apply to a package this project's own authors
# publish. These are developer tools, never a runtime dependency of the shipped crate.
[exclude-newer-package]
softschema = "2099-12-31"
