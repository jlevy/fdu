name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  supply-chain:
    name: Supply-chain provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: node --test scripts/check-supply-chain.test.mjs
      - run: node scripts/check-supply-chain.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: Format check
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: supply-chain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: npm ci --ignore-scripts
      - name: Test Rust module filename policy
        run: node --test scripts/check-rust-module-names.test.mjs
      - name: Check Rust module filenames
        run: node scripts/check-rust-module-names.mjs
      - name: Check every inventory producer routes through shared admission
        run: npm run check:admission-sites
      - name: Check the golden corpus never resolves fdu through PATH
        run: node scripts/check-golden-invocations.mjs
      - name: Check golden sessions expose complete product behavior
        run: npm run check:golden-observability
      - name: Check committed test data names no machine
        run: node scripts/check-portability.mjs
      # The watch tests exercise a different notify backend on each of these runners —
      # inotify, FSEvents, and ReadDirectoryChangesW — which is the only way to catch
      # per-platform event semantics before a user does.
      - run: cargo test --locked --all-features
      - name: Build the CLI for golden tests
        run: cargo build --locked -p fdu --all-features
      - name: Compare the CLI golden contract
        run: npm run test:golden
      - name: Build the repository-only performance probe
        run: cargo build --locked -p fdu-core --example perf_probe --no-default-features
      # `env:` rather than a `PYTHONPATH=... cmd` prefix: this job also runs on the
      # Windows runner, whose shell is PowerShell, where that POSIX prefix form is a
      # parse error rather than an assignment. The harness package is still
      # `benchmarks`; `explorations/` is the directory holding it.
      - name: Prove the performance harness and every fdu probe job
        env:
          PYTHONPATH: explorations
        run: python -m unittest discover -s explorations/benchmarks/tests -p 'test_*.py'

  test-lib-only:
    name: Test library feature boundaries
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      # Library consumers take `default-features = false`. Without this job, that path
      # would only ever be compiled by them.
      - run: cargo test --locked -p fdu-core --no-default-features
      # Optional layers are additive alone and together; neither may inherit CLI-only features.
      - run: cargo test --locked -p fdu-core --no-default-features --features gitignore
      - run: cargo test --locked -p fdu-core --no-default-features --features watch
      - run: cargo test --locked -p fdu-core --no-default-features --features watch,gitignore

  msrv:
    name: MSRV (1.85)
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.85.0
        with:
          toolchain: 1.85.0
      - run: cargo check --locked --all-features
      # Compile success alone misses behavioral and test-only MSRV regressions.
      - run: cargo test --locked -p fdu-core --no-default-features

  docs:
    name: Documentation
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      # This pin is the floor the repository builds against, not just CI's choice:
      # uv releases older than it cannot parse the relative `exclude-newer` in the
      # uv.toml files and fail with a misleading TOML date error. `UV_MIN_VERSION`
      # in the Makefile guards local builds against the same trap; the supply-chain
      # policy verifies that the local floor and both CI pins remain identical.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: false
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: make docs-format-check

  evidence:
    name: Performance evidence
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Same pin and the same reason as every other uv job here; the supply-chain
      # policy verifies that this and the Makefile floor stay identical.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: false
      # The measurement loop is deliberately not in CI -- a timing gate on a shared
      # runner measures the runner. What belongs here is everything that decides what a
      # measurement *means*, and none of it ran on any runner before: the harness that
      # computes the accept arithmetic, the contract the artifacts validate against, and
      # the two generated views a reader quotes from. `make check` covered all four
      # locally, so an artifact edited without running it shipped a stale ledger and a
      # stale evidence page with CI green.
      - name: Prove the experiment-record harness
        run: make perf-test
      - name: The experiment contract must match the model it is compiled from
        run: make perf-schema-check
      - name: The ledger must be what the artifacts produce
        run: make perf-ledger-check
      - name: The projection and the evidence page must be what the artifacts produce
        run: make perf-report-check

  deny:
    name: Dependency audit
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: "--all-features --locked"

  parity:
    name: Python CLI parity
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 24.18.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: false
      - run: npm ci --ignore-scripts
      # The parity surface must be the built wheel, not the working tree: a shim
      # importing python/fdu/ directly would pass while the built package was broken.
      - name: Build and install the wheel the parity surface runs on
        working-directory: crates/fdu-py
        run: |
          uv run --frozen --only-group dev maturin build --locked --release --out dist
          uv venv --clear .venv-parity
          uv pip install --python .venv-parity --no-index --find-links dist fdu
      # Replays tests/golden against the Python surface and compares what differs to
      # tests/parity/deviations-python.diff. That artifact is non-empty by construction,
      # so an empty result fails: it would mean the shim never ran.
      # Recorded here rather than compared here. The artifact holds platform-dependent
      # values -- a cache snapshot encodes to 797 bytes on macOS and 745 on Linux -- so a
      # developer machine cannot falsify its own recording: it compares its own output to
      # its own output and agrees by construction. Two escapes reached CI that way. This
      # job re-records and fails on any difference, so Linux is the authority and the fix
      # is a download rather than a guess.
      - name: Replay the golden corpus against the Python surface
        run: FDU_PARITY_PYTHON=crates/fdu-py/.venv-parity/bin/python node scripts/run-parity.mjs --update
      - name: The recorded deviations must match what this platform produces
        id: parity-diff
        run: git diff --exit-code -- tests/parity/deviations-python.diff
      - name: Upload the deviations this platform recorded
        if: failure() && steps.parity-diff.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deviations-python-linux
          path: tests/parity/deviations-python.diff

  python:
    name: Python ${{ matrix.python }} wheel (${{ matrix.os }})
    needs: supply-chain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      # The supply-chain policy keeps this aligned with the other setup-uv pin and
      # `UV_MIN_VERSION`; see the docs job for why the floor matters.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Test GIL release and Python object borrow exclusion
        working-directory: crates/fdu-py
        run: uv run --frozen --only-group dev python tests/run_concurrency.py
      - name: Build the wheel
        working-directory: crates/fdu-py
        run: uv run --frozen --only-group dev maturin build --locked --release --out dist
      # A separate venv name on purpose: the build step above already created .venv for
      # this project, and `uv venv` refuses to overwrite an existing environment.
      - name: Install and smoke-test the wheel
        working-directory: crates/fdu-py
        run: |
          uv venv --clear .venv-smoke
          uv pip install --python .venv-smoke --no-index --find-links dist fdu
          uv run --no-project --python .venv-smoke python tests/public_smoke.py
          uv run --no-project --python .venv-smoke python tests/smoke.py
      - name: Prove the wheel is directly runnable through uvx
        working-directory: crates/fdu-py
        run: uvx --isolated --no-index --find-links dist --from fdu fdu --version

  python-quality:
    name: Python lint, types, and source distribution
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: false
          python-version: "3.12"
      - run: make python-check
      - run: make python-sdist-smoke
      - run: make release-test
