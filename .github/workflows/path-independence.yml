name: Path independence

# The full path-independence matrix: about 20,000 fdu invocations per platform comparing
# every answer with a cold run across cache histories, policies, file changes, and the
# command-line and Python surfaces. Too slow for every pull request, which runs a subset
# in CI, so this runs weekly, on demand, and on a pull request labelled
# `path-independence-full`.
#
# Each platform uploads every case it judged, the registry it would record, and a diff per
# failing case. The recorded registry is diagnostic evidence of what each platform
# observed, not a waiver: the production gate requires
# tests/path_independence/known-violations.toml to be empty, so any entry fails it.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A new push to a labelled pull request supersedes the runs for the previous one.
concurrency:
  group: path-independence-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  supply-chain:
    name: Supply-chain provenance
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'path-independence-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: node --test scripts/check-supply-chain.test.mjs scripts/check-uv-version.test.mjs
      - run: node scripts/check-supply-chain.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  full:
    name: Full matrix (${{ matrix.os }})
    needs: supply-chain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Build the command line under test
        run: cargo build --locked -p fdu --all-features
      # The Python routes must run the built wheel, never the source tree; pyrun.py
      # refuses a source-tree import.
      - name: Build and install the wheel the Python routes run
        shell: bash
        working-directory: crates/fdu-py
        run: |
          uv run --frozen --only-group dev maturin build --locked --release --out dist
          uv venv --clear --python 3.12 .venv-path-independence
          uv pip install --python .venv-path-independence --no-index --find-links dist fdu
      - name: Run the full matrix and record what this platform observes
        shell: bash
        run: |
          venv="$GITHUB_WORKSPACE/crates/fdu-py/.venv-path-independence"
          if [ "$RUNNER_OS" = Windows ]; then
            export FDU_PYTHON="$venv/Scripts/python.exe"
          else
            export FDU_PYTHON="$venv/bin/python"
          fi
          uv run --no-project --python 3.12 python tests/path_independence/runner.py \
            --tier full --out path-independence-out \
            --judged "path-independence-out/judged-$RUNNER_OS.json" \
            --record path-independence-out/known-violations.toml
      # Uploaded on success too: merging every platform's judged cases is how the
      # diagnostic registry is regenerated (tests/path_independence/README.md).
      - name: Upload the judged cases, recorded registry, and failing diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: path-independence-${{ matrix.os }}
          path: path-independence-out
