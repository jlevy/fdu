# Known path-independence violations. Reviewed like a golden: see registry.py.
# Regenerate with `make path-independence-record`, then classify new entries.

[classes.projection-route]
description = "A .gitignore-observing snapshot serves a request that does not observe .gitignore on one route but not another, so routes disagree on the outcome"
clears_with = "Phase 2 item 4: the observation projection on every route (P2.4.5)"
bead = "fdu-u767"

[classes.unverified-subtree]
description = "Warm reconciliation of an unreadable subtree retains unverified facts or omits boundary diagnostics that a cold scan reports"
clears_with = "Phase 1 item 4: reconciliation drops facts under unverified directories (P1.4.5)"
bead = "fdu-szll"

[[violation]]
class = "projection-route"
paths = [
  "<outcomes:cli-report=complete,py-open=failure,py-report=complete>",
]
keys = [
  "cross/routes/only/W_all/-/a_all_nogi",
  "cross/routes/only/W_all/-/nogi",
  "cross/routes/only/W_all/-/v_summary_nogi",
  "cross/routes/only/W_default/-/nogi",
  "cross/routes/only/W_default/-/v_summary_nogi",
  "cross/routes/only/W_lines/-/nogi",
  "cross/routes/only/W_lines/-/v_summary_nogi",
  "cross/routes/only/W_summary/-/nogi",
  "cross/routes/only/W_summary/-/v_summary_nogi",
  "cross/routes/only/py-open:W_all/-/a_all_nogi",
  "cross/routes/only/py-open:W_all/-/nogi",
  "cross/routes/only/py-open:W_all/-/v_summary_nogi",
  "cross/routes/only/py-open:W_default/-/nogi",
