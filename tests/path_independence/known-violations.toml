# Known path-independence violations. Reviewed like a golden: see registry.py.
# Regenerate with `make path-independence-record`, then classify new entries.

[classes.projection-route]
description = "A .gitignore-observing snapshot serves a request that does not observe .gitignore on one route but not another, so routes disagree on the outcome"
clears_with = "Phase 2 item 4: the observation projection on every route (P2.4.5)"
bead = "fdu-u767"

[classes.refusal-kind]
description = "Python raises fdu's engine error, not ValueError, for a request the command line refuses as invalid, so the surfaces report different kinds of failure"
clears_with = "Phase 1 item 3: request errors map to ValueError in Python (P1.3.4)"
bead = "fdu-sm9z"

[classes.refusal-order]
description = "A request the engine refuses (--one-filesystem without device identity on Windows) is reported as a cache-only miss under --cache only, so which failure a run names depends on the delivery"
clears_with = "Phase 1 item 3: requests are validated before any stored state is read (P1.3.3)"
bead = "fdu-xnjy"

[classes.unverified-subtree]
description = "A warm run over a directory it cannot list serves facts retained from before instead of the partial answer a cold run gives"
clears_with = "Phase 1 item 4: reconciliation drops facts under unverified directories (P1.4.5)"
bead = "fdu-szll"

[classes.windows-change-time]
description = "On Windows a same-size rewrite that keeps its mtime is not detected, because the validity fingerprint reads no change time, so a warm answer serves the old content's metrics"
clears_with = "Read the NTFS change time in the validity fingerprint, or document the limitation (fdu-6act)"
bead = "fdu-6act"

