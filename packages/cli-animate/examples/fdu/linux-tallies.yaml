# Language and document tallies over the Linux kernel source: lines of code, comments,
# and blanks per language, then words and pages per document format. fdu's cache is
# cleared first, so both analyses read every file, with fdu's progress line live.
#
# Needs this repository's release build and a shallow Linux clone under $FDU_DEMO_TREES:
#   git clone --depth 1 https://github.com/torvalds/linux "$FDU_DEMO_TREES/linux"
title: "fdu: languages and documents in the Linux kernel"
terminal: { cols: 222, rows: 28, font_size: 14 }
typing: { seed: 9 }
path: [../../../../target/release]
cwd: $FDU_DEMO_TREES
setup: [fdu linux --cache-clear]
steps:
  - label: languages
    run: fdu linux --analyze code --view languages --limit 8
    hold: 2.5
  - label: documents
    run: fdu linux --analyze words --view documents --limit 6
    hold: 4.5
