# The Linux kernel source end to end, in three commands run from inside it: the full
# usage tree, then code and document tallies twice -- first with fdu's cache cleared, so
# the analysis reads every file with fdu's progress line live, then again, answered from
# the cache the first run built. The page cache is warmed in setup, so "no cache" means
# fdu's own cache, not the disk. The screen never clears: each command's output scrolls
# up under the next, as in a terminal.
#
# Needs this repository's release build and a shallow Linux clone, without its .git
# (the pack file is not part of the source), under $FDU_DEMO_TREES:
#   git clone --depth 1 https://github.com/torvalds/linux "$FDU_DEMO_TREES/linux"
#   rm -rf "$FDU_DEMO_TREES/linux/.git"
# Keep the tree and the fdu binary on an internal disk: timed on a USB drive, the
# recording measures the drive. The intro states the tree's size and file count; update
# it to match the clone.
title: "fdu: the Linux kernel, real time"
# 140 columns fit every result row, since grouped rows stack their measures; only the perf lines wrap.
terminal: { cols: 140, rows: 48, font_size: 14 }
typing: { seed: 9 }
path: [../../../../target/release]
cwd: $FDU_DEMO_TREES/linux
setup:
  - fdu . --cache-clear
  - find . -type f -print0 | xargs -0 cat > /dev/null
steps:
  - label: intro
    comment: "# The entire Linux kernel source: 1.7 GiB in 95,938 files"
    hold: 0.4
  - comment: "# Full tally of usage"
    hold: 0.2
  - label: tree
    run: fdu .
    hold: 2.5
  - comment: "# Full code and document analysis (first run, no cache, slowest)"
    hold: 0.2
  - label: analysis, first run
    before: [fdu . --cache-clear]
    run: fdu . --view code,documents
    hold: 2.5
  - comment: "# Full code and document analysis (subsequent runs, fast)"
    hold: 0.2
  - label: analysis, cached
    run: fdu . --view code,documents
    hold: 4
