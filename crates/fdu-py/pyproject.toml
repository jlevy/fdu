[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "fdu"
description = "Fast, incremental file roll-up engine: hierarchical tallies over large directory trees"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
]

[project.scripts]
fdu = "fdu_py:main"

[dependency-groups]
# Pinned after the repository's 14-day cool-off window; uv.lock freezes its
# transitive environment for local and CI wheel builds.
dev = ["maturin==1.14.1"]

[project.urls]
Repository = "https://github.com/jlevy/fdu"
Documentation = "https://docs.rs/fdu"

[tool.maturin]
# Keep one extension module rather than duplicating the native payload as a bundled
# binary. The `fdu` console script above calls the same Rust process boundary through
# `fdu_py.main`; library consumers still get the persistent in-process index.
module-name = "fdu_py"
features = ["extension-module"]
strip = true
