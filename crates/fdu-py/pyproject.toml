[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "fdu"
description = "Fast, incremental file roll-up engine: hierarchical tallies over large directory trees"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["version"]
authors = [{ name = "Joshua Levy" }]
keywords = ["disk-usage", "filesystem", "rollup", "rust", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
fdu = "fdu:_main"

[dependency-groups]
# Pinned after the repository's 14-day cool-off window; uv.lock freezes its
# transitive environment for local and CI wheel builds.
dev = [
    "basedpyright==1.39.9",
    "maturin==1.14.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[project.urls]
Repository = "https://github.com/jlevy/fdu"
Documentation = "https://docs.rs/fdu"

[tool.maturin]
# Keep one extension module rather than duplicating the native payload as a bundled
# binary. The public package owns typing and value models; its console wrapper and
# retained Index delegate in bulk to the private `fdu._native` implementation.
python-source = "python"
module-name = "fdu._native"
features = ["extension-module"]
strip = true
exclude = ["python/**/__pycache__/**", "python/**/*.pyc"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["python", "tests/typecheck", "examples"]
extraPaths = ["python"]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = true
reportPrivateUsage = false
reportUnusedFunction = false
