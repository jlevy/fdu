[package]
name = "fdu-core"
version = "0.1.0"
description = "The fdu engine: incremental hierarchical tallies over large directory trees"
readme = "README.md"
documentation = "https://docs.rs/fdu-core"
keywords = ["disk-usage", "filesystem", "du", "index", "cache"]
categories = ["filesystem", "caching"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**", "tests/**", "rules/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

# docs.rs builds only the default build features unless told otherwise, and this crate's
# default is empty, so the published docs would omit every API behind a build feature,
# `watch` included. The docs gate builds with all of them for the same reason.
[package.metadata.docs.rs]
all-features = true

[lib]
name = "fdu_core"
path = "src/lib.rs"

[[test]]
name = "watch_session"
path = "tests/watch_session_integration.rs"
required-features = ["watch"]

[[example]]
name = "format_conformance"
required-features = ["watch"]

[features]
# Embedding consumers pay only for the retained one-shot engine unless they opt in.
# The shipped CLI and Python package enable their capabilities explicitly below their
# own package boundaries.
default = []
# Gates the OS-native watch layer. Strictly additive: without it, scan, index, and
# snapshot are all fully functional, just without live updates -- which is what keeps
# the watch layer deletable rather than merely optional. It is a build feature because
# it has a real dependency tree (notify and its platform backends) that a consumer
# should not pay for unless it watches.
watch = ["dep:notify"]
# `.gitignore` handling is deliberately not a build feature. The matcher is in-tree and
# pulls in no dependency, so a gate would remove nothing but code. What a consumer may
# want removed is the filesystem reads, and `ScanConfig::read_controls` is already the
# per-request switch for those. A compile-time gate as well would give "observes
# controls" a second meaning that depends on the build.

[dependencies]
thiserror = "2.0"

# The renderer names three ANSI colours and nothing else. It took them from
# `clap::builder::styling`, which is this crate re-exported -- so the library pulled the
# whole argument parser to spell "bright black", and `report_format` had to hide behind
# the `cli` feature because of it. A library caller could produce a report and not print
# it, which is half an API.
anstyle = "1.0"

notify = { version = "8.2", optional = true }
# Caret ranges in the published manifest: an exact pin here makes any downstream
# that needs a newer compatible release unresolvable. Cargo.lock still pins the
# reviewed versions for this workspace and for `cargo install --locked` (fdu-p7vb).
pulldown-cmark = { version = "0.13.4", default-features = false }

[target.'cfg(unix)'.dependencies]
# Unix control-file reads use O_NONBLOCK so a raced FIFO cannot stall a scan. The
# macOS scan accelerator also calls getattrlistbulk through these official bindings.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Rust 1.85 does not yet expose change time or stable file identity from Windows
# metadata. Keep the audited boundary on the already locked bindings and enable only
# the handle and filesystem APIs it calls.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.26"

[lints]
workspace = true
