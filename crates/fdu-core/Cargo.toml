[package]
name = "fdu-core"
version = "0.1.0"
description = "The fdu engine: incremental hierarchical tallies over large directory trees"
readme = "README.md"
documentation = "https://docs.rs/fdu-core"
keywords = ["disk-usage", "filesystem", "du", "cli", "index"]
categories = ["command-line-utilities", "filesystem"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**", "tests/**", "rules/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "fdu_core"
path = "src/lib.rs"

[[test]]
name = "watch_session"
path = "tests/watch_session_integration.rs"
required-features = ["watch"]

[features]
# The shipped binary watches; `--no-default-features` and library consumers do not,
# and a `--features cli` build without `watch` still compiles, which is what keeps the
# watch layer deletable rather than merely optional.
default = ["watch"]
# Gates the OS-native watch layer. Strictly additive: without it, scan, index,
# snapshot, and the CLI are all fully functional, just without live updates.
watch = ["dep:notify"]
[dependencies]
thiserror = "2.0"

# The renderer names three ANSI colours and nothing else. It took them from
# `clap::builder::styling`, which is this crate re-exported -- so the library pulled the
# whole argument parser to spell "bright black", and `report_format` had to hide behind
# the `cli` feature because of it. A library caller could produce a report and not print
# it, which is half an API.
anstyle = "1.0"

notify = { version = "8.2", optional = true }
pulldown-cmark = { version = "=0.13.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS scan accelerator calls getattrlistbulk through the official Rust libc
# bindings. Keep the direct surface target-specific and pinned to the version already
# reviewed and locked transitively in this workspace.
libc = "=0.2.189"

[dev-dependencies]
tempfile = "3.26"

[lints]
workspace = true
