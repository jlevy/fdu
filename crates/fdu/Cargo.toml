[package]
name = "fdu"
version = "0.0.1"
description = "A fast, incremental file roll-up engine: hierarchical tallies over large directory trees"
readme = "README.md"
documentation = "https://docs.rs/fdu"
keywords = ["disk-usage", "filesystem", "du", "cli", "index"]
categories = ["command-line-utilities", "filesystem"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
exclude = [
    ".github/",
    "docs/",
    "attic/",
    "benchmarks/",
    "examples/perf_probe.rs",
]

[lib]
name = "fdu"
path = "src/lib.rs"

[[bin]]
name = "fdu"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "watch_session"
path = "tests/watch_session_integration.rs"
required-features = ["watch"]

[[test]]
name = "cli_exit"
path = "tests/cli_exit.rs"
required-features = ["cli"]

# Drives the real binary, so the binary has to exist.
[[test]]
name = "scan_watermark"
path = "tests/scan_watermark_integration.rs"
required-features = ["cli"]

# Drives the real binary in watch mode, so it needs both features, not either one.
[[test]]
name = "watch_persistence"
path = "tests/watch_persistence.rs"
required-features = ["cli", "watch"]

[features]
# The shipped binary watches; `--no-default-features` and library consumers do not,
# and a `--features cli` build without `watch` still compiles, which is what keeps the
# watch layer deletable rather than merely optional.
default = ["cli", "watch"]
# Gates clap and the [[bin]], flowmark-style: library consumers take
# `default-features = false` and never compile the CLI's dependency tree.
cli = ["dep:clap", "dep:anyhow"]
# Gates the OS-native watch layer. Strictly additive: without it, scan, index,
# snapshot, and the CLI are all fully functional, just without live updates.
watch = ["dep:notify"]
# Per-layer operation tallies: syscalls, allocations, and index work. Off in the
# shipped binary and on in the performance probe, so that a measurement can say what
# a run *did* and not only how long it took. The overhead of leaving it on is
# recorded in exp-052 rather than assumed.
perf-counters = []

[dependencies]
thiserror = "2.0"

clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
notify = { version = "8.2", optional = true }
pulldown-cmark = { version = "=0.13.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS scan accelerator calls getattrlistbulk through the official Rust libc
# bindings. Keep the direct surface target-specific and pinned to the version already
# reviewed and locked transitively in this workspace.
libc = "=0.2.189"

[dev-dependencies]
tempfile = "3.26"

[lints]
workspace = true
